# pinakes.yaml
spec: 0.1
project:
  name: "[Your Universe Name]"
  nsid: "example.universe"
  # Chapter frontmatter key naming the sequence a chapter belongs to — the
  # grouping between book and chapter. Rename to match your universe
  # (a meal, an arc, a case, a session); records carry it as `sequence`.
  sequenceField: "sequence"
paths:
  registry: "codex/entities.yaml"
  nonEntities: "codex/non_entities.yaml"
  stories: "stories"
  locations: "codex/locations"
  characters: "codex/characters"
  output: "records"

# Optional. Configures `pinakes prose-check`, the mechanical half of the
# AI-tells pass. Every field has a default — the built-in signal list is the
# catalogue itself — so you can delete this whole block and the command still
# works. See docs/prose-triage.md.
